name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      # Lint must fail on violations instead of silently rewriting the checkout.
      - run: ruff check .
      - run: pytest -q
      # Readiness report must build without any provider configured.
      - run: python scripts/validate_production.py
        env:
          TOM_ENV: development
          TOM_LLM_ENABLED: "false"
          TOM_TTS_ENGINE: disabled
          TOM_NEURAL_VAD: "false"
