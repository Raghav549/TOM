name: Bug report
description: Report reproducible behaviour that differs from TOM's documented behaviour.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to improve TOM. Please do not include secrets, API keys, device secrets, personal data, or private URLs.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behaviour and the expected behaviour.
      placeholder: "Actual: …\nExpected: …"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TOM version or commit
      placeholder: "e.g. 0.5.3 or abc1234"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Runtime / planner
        - Permissions / approval
        - Browser
        - Android bridge
        - Voice
        - Frontend
        - API / event stream
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant safe-to-share logs or screenshots
      description: Redact credentials, tokens, personal data, and private endpoints.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and removed sensitive information.
          required: true
