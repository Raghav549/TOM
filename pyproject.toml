[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tom-agent"
version = "0.4.0"
description = "Open-source-first personal multimodal AI agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
voice = [
  "numpy>=1.26,<3",
  "faster-whisper>=1.2,<2",
]
voice-neural = [
  "numpy>=1.26,<3",
  "faster-whisper>=1.2,<2",
  "silero-vad>=6,<7",
  "onnxruntime>=1.18,<2",
]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["tom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
