[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "tom-agent"
version = "0.5.3"
description = "Open-source-first personal multimodal AI agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "cryptography>=44,<47",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
voice = [
  "numpy>=1.26,<3",
  "faster-whisper>=1.2,<2",
]
# Remote Qwen3-TTS clients do not need Torch or a local checkpoint. Render installs
# this extra, so keeping it lightweight prevents a free web instance from spending
# its build budget on CUDA packages it cannot use.
voice-qwen = ["numpy>=1.26,<3"]
# Install this only on a GPU/local model host that actually runs Qwen3-TTS locally.
voice-qwen-local = [
  "numpy>=1.26,<3",
  "qwen-tts @ git+https://github.com/dffdeeq/Qwen3-TTS-streaming.git@13ef823ffe76aec4ac7e35d3fec28ecfc8d7427a",
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "torch>=2.9,<3",
  "torchaudio>=2.9,<3",
  "librosa>=0.11,<1",
  "sox>=1.5,<2",
  "onnxruntime>=1.24,<2",
  "einops>=0.8,<1",
  "soundfile>=0.13,<1",
]
voice-indic = [
  "numpy>=1.26,<3",
  "torch>=2.5,<3",
  "transformers>=4.57.3,<6",
  "soundfile>=0.13,<1",
  "parler-tts @ git+https://github.com/huggingface/parler-tts.git",
]
memory = [
  "numpy>=1.26,<3",
  "sentence-transformers>=5,<6",
]
voice-neural = [
  "numpy>=1.26,<3",
  "faster-whisper>=1.2,<2",
  "silero-vad>=6,<7",
  "onnxruntime>=1.24,<2",
  "pipecat-ai>=0.0.100,<2",
  "soxr>=1,<2",
]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# These catches intentionally turn optional local hardware/dependency probes into
# explicit runtime availability decisions rather than crashing the production process.
"tom/voice/qwen3_tts_stream.py" = ["BLE001"]
